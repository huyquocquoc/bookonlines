spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://192.168.1.88:5437/postgres
    username: postgres
    password: All4one7!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8086
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: bookstore-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
  expiration: 86400000  # 24 hours in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bookstore: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

