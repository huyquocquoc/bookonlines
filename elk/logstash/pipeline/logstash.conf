input {
  tcp {
    port => 5000
    codec => json_lines
  }
  
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add service name from log path or tags
  if [log][file][path] {
    grok {
      match => { "[log][file][path]" => "/var/log/%{DATA:service_name}/" }
    }
  }
  
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }
  
  # Add environment tag
  mutate {
    add_field => { "environment" => "development" }
  }
  
  # Parse log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
  
  # Extract exception information
  if [exception] {
    mutate {
      add_field => { "has_exception" => "true" }
    }
  }
  
  # Add correlation ID if present
  if [correlation_id] {
    mutate {
      add_field => { "trace_id" => "%{correlation_id}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "bookstore-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Output to console for debugging (optional)
  stdout {
    codec => rubydebug
  }
}

